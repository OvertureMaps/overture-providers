<svg xmlns="http://www.w3.org/2000/svg" width="980" height="140" viewBox="0 0 980 140" role="img" aria-labelledby="title desc">
  <title id="title">overture-providers</title>
  <desc id="desc">The repository name beside unlabeled data provider points whose edges converge into two package boxes, which feed a single published package.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001A39"/>
      <stop offset="1" stop-color="#14205A"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0EC1BD"/>
      <stop offset="1" stop-color="#4051CC"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="980" height="140" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="980" height="140" fill="url(#bg)"/>
    <g stroke="#4EDAD8" stroke-opacity="0.05" stroke-width="1">
      <path d="M0 35 H980 M0 70 H980 M0 105 H980"/>
      <path d="M560 0 V140 M640 0 V140 M720 0 V140 M800 0 V140 M880 0 V140"/>
    </g>
    <g fill="none" stroke="#4EDAD8" stroke-width="1.2">
      <ellipse cx="900" cy="155" rx="70" ry="34" stroke-opacity="0.16"/>
      <ellipse cx="900" cy="155" rx="130" ry="62" stroke-opacity="0.11"/>
      <ellipse cx="900" cy="155" rx="200" ry="95" stroke-opacity="0.07"/>
      <ellipse cx="900" cy="155" rx="280" ry="130" stroke-opacity="0.045"/>
    </g>
  </g>

  <g font-family="Montserrat, Arial, sans-serif">
    <text x="36" y="70" font-size="44" font-weight="700" fill="#FFFFFF">overture-providers</text>
    <text x="38" y="102" font-size="19" font-weight="300" fill="#4EDAD8">Provider metadata for Overture, as Python packages</text>
  </g>

  <g fill="none" stroke="url(#edge)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.85">
    <path d="M586 26 C650 26 660 50 720 50"/>
    <path d="M586 48 C650 48 660 50 720 50"/>
    <path d="M586 70 C650 70 660 50 720 50"/>
    <path d="M586 70 C650 70 660 90 720 90"/>
    <path d="M586 92 C650 92 660 90 720 90"/>
    <path d="M586 114 C650 114 660 90 720 90"/>
  </g>
  <g stroke-width="2.5" stroke-linecap="round" fill="none" stroke="url(#edge)">
    <path d="M772 50 C820 50 830 62 862 64"/>
    <path d="M772 90 C820 90 830 78 862 76"/>
  </g>

  <g>
    <circle cx="580" cy="26" r="4" fill="#4EDAD8" fill-opacity="0.8"/>
    <circle cx="580" cy="48" r="3" fill="#96C93D"/>
    <circle cx="580" cy="70" r="4.5" fill="#0EC1BD"/>
    <circle cx="580" cy="92" r="3" fill="#05A5AF"/>
    <circle cx="580" cy="114" r="3.5" fill="#00A790"/>
    <circle cx="562" cy="38" r="2" fill="#4051CC"/>
    <circle cx="560" cy="82" r="2" fill="#4EDAD8" fill-opacity="0.6"/>
    <circle cx="564" cy="104" r="2" fill="#4051CC"/>
  </g>

  <g stroke-width="2">
    <rect x="720" y="37" width="52" height="26" rx="7" fill="#001A39" stroke="#0EC1BD"/>
    <circle cx="733" cy="50" r="3.5" fill="#00A790"/>
    <path d="M743 50 H761" stroke="#4EDAD8" stroke-opacity="0.6" stroke-linecap="round"/>
    <rect x="720" y="77" width="52" height="26" rx="7" fill="#001A39" stroke="#4051CC"/>
    <circle cx="733" cy="90" r="3.5" fill="#96C93D"/>
    <path d="M743 90 H761" stroke="#4EDAD8" stroke-opacity="0.6" stroke-linecap="round"/>
  </g>

  <g filter="url(#glow)" stroke-width="1.5" stroke-linejoin="round">
    <path d="M900 44 L934 58 L900 72 L866 58 Z" fill="#0EC1BD" fill-opacity="0.9" stroke="#4EDAD8"/>
    <path d="M866 58 L900 72 L900 106 L866 92 Z" fill="#2C2E7F" stroke="#4051CC"/>
    <path d="M934 58 L900 72 L900 106 L934 92 Z" fill="#4051CC" fill-opacity="0.85" stroke="#4EDAD8" stroke-opacity="0.5"/>
  </g>
  <path d="M883 51 L917 65" stroke="#001A39" stroke-opacity="0.45" stroke-width="3" fill="none"/>
  <circle cx="900" cy="58" r="3.5" fill="#96C93D"/>
</svg>
