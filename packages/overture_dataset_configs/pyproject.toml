[project]
name = "overture-dataset-configs"
dynamic = ["version"]
description = "Public dataset license/policy configs for Overture providers."
readme = "README.md"
authors = [{ name = "Overture Maps Foundation" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/OvertureMaps/overture-providers"
Source = "https://github.com/OvertureMaps/overture-providers/tree/main/packages/overture_dataset_configs"
Issues = "https://github.com/OvertureMaps/overture-providers/issues"

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-cov>=7.0.0", "overture-core>=1.2.3", "license-expression>=30.0"]

[build-system]
requires = ["setuptools>=77.0.3", "setuptools_scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["overture_dataset_configs*"]

[tool.setuptools.package-data]
overture_dataset_configs = ["datasets/*.json", "license_policy.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["overture_dataset_configs"]

[tool.setuptools_scm]
root = "../.."
tag_regex = "^overture_dataset_configs-v(?P<version>.*)$"
git_describe_command = "git describe --dirty --tags --long --match 'overture_dataset_configs-v*'"
# PyPI rejects local version identifiers (the "+g<hash>" suffix), so drop it.
local_scheme = "no-local-version"

[tool.semantic_release]
commit_parser = "conventional-monorepo"
tag_format = "overture_dataset_configs-v{version}"
allow_zero_version = true

[tool.semantic_release.commit_parser_options]
# Attributes a commit to this package by the files it touched.
path_filters = ["."]
# Floor every recognized type at a patch bump so any release-worthy push to
# this package produces a new version (2 == LevelBump.PATCH).
default_bump_level = 2