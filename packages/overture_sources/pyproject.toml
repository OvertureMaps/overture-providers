[project]
name = "overture-sources"
dynamic = ["version"]
description = "Overture source registry JSON files."
readme = "README.md"
authors = [{ name = "Overture Maps Foundation" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/OvertureMaps/overture-providers"
Source = "https://github.com/OvertureMaps/overture-providers/tree/main/packages/overture_sources"
Issues = "https://github.com/OvertureMaps/overture-providers/issues"

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-cov>=7.0.0"]

[build-system]
requires = ["setuptools>=77.0.3", "setuptools_scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["overture_sources*"]

[tool.setuptools.package-data]
overture_sources = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["overture_sources"]

[tool.setuptools_scm]
root = "../.."
tag_regex = "^overture_sources-v(?P<version>.*)$"
git_describe_command = "git describe --dirty --tags --long --match 'overture_sources-v*'"
# PyPI rejects local version identifiers (the "+g<hash>" suffix), so drop it.
local_scheme = "no-local-version"

[tool.semantic_release]
commit_parser = "conventional-monorepo"
tag_format = "overture_sources-v{version}"
allow_zero_version = true

[tool.semantic_release.commit_parser_options]
# Attributes a commit to this package by the files it touched.
path_filters = ["."]
# Floor every recognized type at a patch bump so any release-worthy push to
# this package produces a new version (2 == LevelBump.PATCH).
default_bump_level = 2